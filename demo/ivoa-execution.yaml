executable:
  kind: "https://www.purl.org/ivoa.net/Calycopis-openapi/schema/v1.0/kinds/executable/docker-container.yaml"
  meta:
    description: |-
      A simple Alpine based container that uses the coreutils hashing tools to calculate a checksum of a file or directory.
      See https://www.gnu.org/software/coreutils/manual/html_node/Summarizing-files.html
      Command line parameters (positional):
        1) HASH   - md5sum|shasum|sha256sum|sha512sum (default: md5sum)
        2) FORMAT - native|json                       (default: json)
      Environment parameters (named):
        INPUT - path to the target file or directory  (default: /input)
  image:
    locations:
      - "ghcr.io/zarquan/heliophorus-androcles:sha-9a2513b"
    digest: "sha256:0dfeaad1f37ab8cd506f3a16d1ade56d035694a34e0ff28be51b97f1924c4df3"
compute:
  kind: "https://www.purl.org/ivoa.net/Calycopis-openapi/schema/v1.0/kinds/compute/simple-compute-resource.yaml"
  meta:
    description: >-
      A simple compute resource, with a volume mount for the input data.
      You can add additional constraints for the number of cores and size of memory if needed.
  volumes:
    - kind: "https://www.purl.org/ivoa.net/Calycopis-openapi/schema/v1.0/kinds/volume/simple-volume-mount.yaml"
      path: "/input"
      mode: "READONLY"
      resource: "input-data"
data:
  - kind: "https://www.purl.org/ivoa.net/Calycopis-openapi/schema/v1.0/kinds/data/abstract-data-resource.yaml"
    meta:
      name: "input-data"
      description: |-
        A description of the input data that we want to be checksummed.
        Replace this element with a concrete data resource e.g.
        a simple-data-resource element with a download URL.

